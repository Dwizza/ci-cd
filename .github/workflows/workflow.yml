name: Build 

on:
  push:
    branches:
      - dwiza

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        fetch-depth: 0  # This ensures you fetch all branches, not just the latest commit

    - name: Install Composer dependencies
      run: composer install

    - name: Install Node.js dependencies
      run: npm install

    - name: Build TailwindCSS
      run: npx tailwindcss -i ./styles.css -o ./output.css --build

    - name: Run PHP unit tests
      run: ./vendor/bin/phpunit tests

    - name: Configure git user
      run: |
        git config --global user.name "Dwizza"
        git config --global user.email "oussamaerrahili124@gmail.com"

    - name: Switch to main branch
      run: |
        git fetch origin main  # Fetch the latest version of the main branch
        git checkout main  # Switch to the main branch
        git merge dwiza  # Merge the `dwiza` branch into `main`

    - name: Push changes
      run: |
        git push origin main  # Push the merged changes back to the main branch

